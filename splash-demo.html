<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Chameleon VPN — заставка</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
@font-face{font-family:'FDJ';src:url(fonts/forma-djr-cyrillic-text-4.woff2)format('woff2');font-weight:700;font-display:swap}
@font-face{font-family:'FDJ';src:url(fonts/forma-djr-cyrillic-text-2.woff2)format('woff2');font-weight:500;font-display:swap}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--acc:#FC1222;--txt:#D6E5E2;--mut:rgba(214,229,226,.42)}
html,body{height:100%;background:#000;overflow:hidden;color:var(--txt);font-family:'FDJ',-apple-system,BlinkMacSystemFont,system-ui,sans-serif}
#splash{position:fixed;inset:0;background:#000;overflow:hidden}
#ptc{position:absolute;inset:0;width:100%;height:100%}
#stext{position:absolute;bottom:12%;left:0;right:0;padding:0 24px;will-change:opacity,transform}
.sp-line{height:1px;background:linear-gradient(90deg,rgba(252,18,34,.85),transparent);margin-bottom:18px;opacity:0;transform:scaleX(0);transform-origin:left;animation:spLineIn .5s cubic-bezier(.22,.61,.36,1) forwards .2s}
@keyframes spLineIn{to{opacity:1;transform:scaleX(1)}}
.sp-w1,.sp-w2{display:block;opacity:0;transform:translateY(16px);animation:spWordIn .8s cubic-bezier(.16,.8,.3,1) forwards}
.sp-w1{animation-delay:.3s}.sp-w2{animation-delay:.48s}
@keyframes spWordIn{to{opacity:1;transform:translateY(0)}}
.sp-sub{font-size:11px;font-weight:500;color:var(--mut);letter-spacing:3px;text-transform:uppercase;margin-top:14px;opacity:0;animation:spSubIn .8s ease forwards .7s}
@keyframes spSubIn{to{opacity:1}}
.sp-title{font-weight:700;font-size:clamp(24px,12vw,76px);line-height:.9;letter-spacing:.01em;text-transform:uppercase}
.sp-title em{color:var(--acc);font-style:normal}
#reveal{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;opacity:0;pointer-events:none;padding:24px;text-align:center;
  background:radial-gradient(130% 80% at 50% -10%,#3a0710 0%,rgba(20,2,5,0) 60%),linear-gradient(180deg,#0b0102,#000)}
#reveal.on{pointer-events:auto}
.rv-t{font-size:40px;font-weight:700;letter-spacing:-.01em;line-height:1}
.rv-t em{font-style:normal;color:#FF2D3A;text-shadow:0 0 28px rgba(255,45,58,.55)}
.rv-s{font-size:15px;color:rgba(214,229,226,.6)}
.rv-b{margin-top:18px;display:flex;flex-direction:column;gap:10px;width:min(320px,100%)}
.btn{height:54px;border-radius:16px;border:0;font-weight:600;font-size:16px;font-family:inherit;cursor:pointer;transition:transform .2s cubic-bezier(.2,.8,.2,1)}
.btn:active{transform:scale(.97)}
.btn.p{background:linear-gradient(180deg,#FF3341,#D80F1E);color:#fff;box-shadow:0 10px 30px -8px rgba(252,18,34,.7),inset 0 1px 0 rgba(255,255,255,.25)}
.btn.g{background:rgba(255,255,255,.06);color:var(--txt);border:1px solid rgba(255,255,255,.1)}
</style>
</head>
<body>
<div id="splash">
  <canvas id="ptc"></canvas>
  <div id="stext">
    <div class="sp-line"></div>
    <div class="sp-title"><span class="sp-w1">CHAMELEON</span><span class="sp-w2"><em>VPN.</em></span></div>
    <div class="sp-sub">Защита нового уровня</div>
  </div>
</div>
<div id="reveal">
  <div class="rv-t">Chameleon <em>VPN</em></div>
  <div class="rv-s">Здесь откроется приложение</div>
  <div class="rv-b">
    <button class="btn p" id="again">Повторить заставку</button>
    <button class="btn g" id="open">Открыть текущее приложение</button>
  </div>
</div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <path id="cq" d="M78 118 C 80 64, 103 24, 120 4"/>
  <path id="cqR" d="M120 4 C 137 24, 160 64, 162 118"/>
  <path id="ridge" d="M120 16 C 121 50, 121 76, 120 100"/>
  <path id="headTop" d="M62 152 C 46 142, 36 130, 40 120 C 48 98, 84 90, 120 92 C 156 90, 192 98, 200 120 C 204 130, 194 142, 178 152"/>
  <path id="lipU" d="M62 152 Q 92 184 120 190 Q 148 184 178 152"/>
  <path id="lipL" d="M62 152 Q 92 184 120 190 Q 148 184 178 152"/>
  <path id="jaw" d="M62 152 C 68 176, 90 200, 120 220 C 150 200, 172 176, 178 152"/>
  <path id="headFill" d="M78 118 C 80 64, 103 24, 120 4 C 137 24, 160 64, 162 118 L 200 120 C 204 130, 194 142, 178 152 Q 148 184 120 190 Q 92 184 62 152 C 46 142, 36 130, 40 120 Z"/>
</svg>
<script>
const tg=window.Telegram?.WebApp;
if(tg){tg.ready();tg.expand();try{tg.setHeaderColor('#000000');tg.setBackgroundColor('#000000');}catch(e){}
  if(['ios','android'].includes(tg.platform)&&tg.isVersionAtLeast?.('8.0')){try{tg.requestFullscreen();tg.disableVerticalSwipes();}catch(e){}}}
const haptic=s=>{try{tg?.HapticFeedback?.impactOccurred(s);}catch(e){}};
const FREEZE=new URLSearchParams(location.search).get('t');

const cv=document.getElementById('ptc'),ctx=cv.getContext('2d');
const stext=document.getElementById('stext'),reveal=document.getElementById('reveal');
const DPR=Math.min(devicePixelRatio||1,2);
let W,H;
function size(){W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
size();addEventListener('resize',size);

// ===== ПЛАНЕТА — та же, что в текущей заставке =====
const ll=(la,lo)=>{const r=Math.PI/180,y=la*r,x=lo*r;return[Math.cos(y)*Math.cos(x),Math.sin(y),Math.cos(y)*Math.sin(x)];};
const CONT=[
[[70,-140],[72,-125],[68,-100],[65,-85],[55,-65],[45,-60],[35,-75],[25,-80],[18,-88],[10,-83],[10,-77],[15,-93],[20,-105],[25,-110],[32,-117],[40,-124],[48,-124],[55,-130],[58,-137],[65,-140]],
[[12,-72],[8,-60],[3,-50],[0,-50],[-5,-35],[-15,-39],[-23,-43],[-35,-57],[-42,-63],[-52,-70],[-55,-66],[-50,-73],[-42,-73],[-25,-70],[-15,-75],[-5,-80],[0,-78],[8,-77]],
[[36,28],[40,27],[42,22],[45,13],[43,7],[47,5],[51,-2],[51,4],[55,8],[58,12],[60,11],[63,14],[68,18],[70,25],[68,28],[60,25],[55,22],[54,18],[57,15],[54,14],[52,15],[48,17],[46,16],[43,16],[40,18],[36,14]],
[[37,10],[37,12],[36,15],[30,32],[22,37],[12,44],[5,41],[0,42],[-5,40],[-10,40],[-20,35],[-35,27],[-34,18],[-17,12],[-5,9],[0,9],[5,3],[4,10],[8,3],[5,-5],[4,-7],[10,-17],[14,-17],[20,-17],[28,-12]],
[[10,78],[22,88],[28,97],[20,110],[8,100],[1,104],[8,98],[16,97],[22,92],[28,87],[30,80],[35,78],[35,72],[45,60],[50,58],[55,62],[60,60],[65,55],[68,58],[73,68],[70,80],[68,90],[70,100],[73,110],[72,140],[68,162],[65,165],[60,165],[52,142],[45,135],[40,122],[35,120],[30,122],[22,108]],
[[-15,128],[-10,136],[-12,142],[-18,148],[-24,152],[-32,152],[-38,147],[-38,140],[-38,130],[-34,122],[-28,114],[-22,114],[-17,122]],
[[82,-22],[82,-45],[76,-65],[70,-50],[64,-50],[60,-44],[62,-42],[65,-38],[72,-24],[76,-18],[80,-20]]];
const NODES=[[51.5,-.1],[48.8,2.35],[55.7,37.6],[40.7,-74],[34,-118],[35.6,139.7],[1.3,103.8],[39.9,116.4],[28.6,77.2],[50.4,30.5],[41,29],[59.9,30.3]];
const gp=[];
CONT.forEach(c=>{for(let i=0;i<c.length;i++){const a=c[i],b=c[(i+1)%c.length];const n=Math.max(2,Math.ceil(Math.hypot(b[0]-a[0],b[1]-a[1])/2));
  for(let t=0;t<n;t++){const f=t/n,la=a[0]+(b[0]-a[0])*f,lo=a[1]+(b[1]-a[1])*f;const[x,y,z]=ll(la,lo);gp.push({x,y,z,t:0,s:.5+Math.random()*.9});
    if(Math.random()<.4){const[sx,sy,sz]=ll(la+(Math.random()-.5)*7,lo+(Math.random()-.5)*7);gp.push({x:sx,y:sy,z:sz,t:1,s:.15+Math.random()*.45});}}}});
NODES.forEach(([la,lo])=>{const[x,y,z]=ll(la,lo);gp.push({x,y,z,t:2,s:2.2+Math.random()*.8});});
const phi=Math.PI*(3-Math.sqrt(5));
for(let i=0;i<120;i++){const yy=1-(i/119)*2,r=Math.sqrt(1-yy*yy),tt=phi*i;gp.push({x:Math.cos(tt)*r,y:yy,z:Math.sin(tt)*r,t:3,s:.12+Math.random()*.25});}
const cT=Math.cos(.42),sT=Math.sin(.42);
let BASE_R=100;

function drawGlobe(cx,cy,R,ang,scan,alpha,squash){
  if(R<.4||alpha<=.003)return;
  const k=Math.max(.45,R/BASE_R);
  ctx.save();ctx.globalAlpha=alpha;
  if(squash){ctx.translate(cx,cy);ctx.scale(1+squash*.15,1-squash);ctx.translate(-cx,-cy);}
  const rim=ctx.createRadialGradient(cx,cy,R*.82,cx,cy,R*1.1);
  rim.addColorStop(0,'rgba(252,18,34,0)');rim.addColorStop(.75,'rgba(252,18,34,.06)');rim.addColorStop(1,'rgba(252,18,34,0)');
  ctx.beginPath();ctx.arc(cx,cy,R*1.1,0,Math.PI*2);ctx.fillStyle=rim;ctx.fill();
  const cA=Math.cos(ang),sA=Math.sin(ang),cS=Math.cos(scan),sS=Math.sin(scan);
  const pr=[];
  for(const p of gp){
    const rx=p.x*cA+p.z*sA,rz=-p.x*sA+p.z*cA;const ty=p.y*cT-rz*sT,tz=p.y*sT+rz*cT;
    if(tz<=-.05)continue;
    pr.push({sx:cx+rx*R,sy:cy+ty*R,sc:(tz+1.5)/2.5,s:p.s,t:p.t,beam:Math.max(0,(p.x*cS+p.z*sS-.965)*28),lit:Math.max(0,.45+ty*.55)});
  }
  pr.sort((a,b)=>a.sc-b.sc);
  for(const p of pr){
    const{sc,s,t,beam,lit}=p;let a,sz;
    if(t===0){a=Math.pow(sc,1.1)*.9*lit+beam*.45;sz=s*sc*1.3;}
    else if(t===1){a=Math.pow(sc,1.9)*.55*lit+beam*.2;sz=s*sc;}
    else if(t===2){a=sc*.95;sz=s*Math.max(.5,sc);
      if(sc>.3){ctx.beginPath();ctx.arc(p.sx,p.sy,sz*5*k,0,Math.PI*2);ctx.fillStyle=`rgba(252,18,34,${sc*.07})`;ctx.fill();
        ctx.beginPath();ctx.arc(p.sx,p.sy,sz*2.2*k,0,Math.PI*2);ctx.fillStyle=`rgba(252,18,34,${sc*.22})`;ctx.fill();}}
    else{a=Math.pow(sc,3.2)*.12+beam*.04;sz=s*sc*.55;}
    sz*=k;
    if(!sz||sz<.06||a<.012)continue;
    ctx.beginPath();ctx.arc(p.sx,p.sy,Math.max(.18,sz),0,Math.PI*2);ctx.fillStyle=`rgba(252,18,34,${Math.min(1,a)})`;ctx.fill();
  }
  ctx.restore();
}

// ===== ХАМЕЛЕОН — из тех же красных точек =====
const SV=240,cham=[];
function sample(id,step,part,kind,start,dur){
  const el=document.getElementById(id),L=el.getTotalLength(),n=Math.ceil(L/step);
  for(let i=0;i<=n;i++){const q=el.getPointAtLength(L*i/n);cham.push({x:q.x,y:q.y,part,kind,d:start+dur*(i/n),s:.55+Math.random()*.7,j:Math.random()});}
}
function ring(cx,cy,r,step,part,kind,start,dur){
  const n=Math.ceil(Math.PI*2*r/step);
  for(let i=0;i<n;i++){const a=-Math.PI/2+i/n*Math.PI*2;cham.push({x:cx+Math.cos(a)*r,y:cy+Math.sin(a)*r,part,kind,d:start+dur*(i/n),s:.55+Math.random()*.7,j:Math.random()});}
}
// порядок дорисовки: шлем → голова → глаза → пасть
sample('cq',2.1,'head','accent',0,.42);
sample('cqR',2.4,'head','line',.06,.42);
sample('ridge',3.2,'head','faint',.2,.3);
sample('headTop',2.3,'head','line',.15,.55);
sample('lipU',2.3,'head','lip',.45,.3);
sample('lipL',2.6,'jaw','lip',.5,.3);
sample('jaw',2.4,'jaw','line',.42,.4);
[[54,128],[186,128]].forEach(([x,y],i)=>{
  ring(x,y,28,2.3,'head','line',.25+i*.05,.45);
  ring(x,y,20,3,'head','faint',.32+i*.05,.4);
  ring(x,y,12.5,2.6,'head','faint',.38+i*.05,.35);
});
{const p2=new Path2D(document.getElementById('headFill').getAttribute('d'));const oc=document.createElement('canvas').getContext('2d');
  let tries=0,cnt=0;
  while(tries++<9000&&cnt<420){const x=40+Math.random()*160,y=6+Math.random()*184;
    if(oc.isPointInPath(p2,x,y)&&Math.hypot(x-54,y-128)>30&&Math.hypot(x-186,y-128)>30){cham.push({x,y,part:'head',kind:'scale',d:.3+Math.random()*.6,s:.25+Math.random()*.45,j:Math.random()});cnt++;}}
  tries=0;cnt=0;
  while(tries++<3000&&cnt<40){const x=66+Math.random()*108,y=156+Math.random()*62;
    const f=x<120?(x-62)/58:(178-x)/58,top=152+38*f,bot=152+68*f;
    if(y>top+4&&y<bot-4){cham.push({x,y,part:'jaw',kind:'scale',d:.6+Math.random()*.3,s:.25+Math.random()*.4,j:Math.random()});cnt++;}}}
const PUPILS=[[54,128],[186,128]];
const NODESC=[{x:111,y:146,s:1.1},{x:129,y:146,s:1.1},{x:120,y:5,s:1.6}];

// ===== движение =====
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const E={
  inOut:t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,
  out:t=>1-Math.pow(1-t,3),
  out5:t=>1-Math.pow(1-t,5),
  in:t=>t*t*t,
  in4:t=>t*t*t*t,
  soft:t=>{const c=1.15;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2);}
};
const lerp=(a,b,k)=>a+(b-a)*k;

// ===== хореография, секунды =====
const T={
  morph:[1.25,2.05],
  draw:[1.35,2.35],
  steps:[2.35,2.8,3.25],stepDur:.38,
  open:[3.5,3.8],
  pull:[3.62,4.12],
  close:[4.1,4.32],
  wave:[4.3,4.9],
  dive:[4.65,5.35],
  reveal:[5.1,5.6]
};

let t0=0,raf=0,fired={};
const once=(k,f)=>{if(!fired[k]){fired[k]=1;f();}};
let eyeL={x:0,y:0},eyeR={x:0,y:0};

function cavityPath(hx,hy,k,dy){
  const P=(x,y)=>[hx+x*k,hy+y*k],p=new Path2D();
  let [ax,ay]=P(62,152);p.moveTo(ax,ay);
  let [cx,cy]=P(92,184),[bx,by]=P(120,190);p.quadraticCurveTo(cx,cy,bx,by);
  [cx,cy]=P(148,184);[ax,ay]=P(178,152);p.quadraticCurveTo(cx,cy,ax,ay);
  [cx,cy]=P(148,184+dy);[bx,by]=P(120,190+dy);p.quadraticCurveTo(cx,cy,bx,by);
  [cx,cy]=P(92,184+dy);[ax,ay]=P(62,152);p.quadraticCurveTo(cx,cy,ax,ay);
  p.closePath();return p;
}

function frame(now){
  if(!t0)t0=now;
  const t=FREEZE!==null?+FREEZE:(now-t0)/1000;
  ctx.clearRect(0,0,W,H);
  const minS=Math.min(W,H);BASE_R=minS*.31;
  const HW=Math.min(W*.8,340),k=HW/SV;
  const hx=W/2-HW/2,hy=H*.5;

  // планета: старт ровно как сейчас (центр 42% высоты, радиус 31%)
  let gx=W/2,gy=H*.42,R=BASE_R;
  const m=E.inOut(seg(t,...T.morph));
  const parkY=H*.27,parkR=BASE_R*.78;
  gy=lerp(gy,parkY,m);R=lerp(R,parkR,m);
  const stopY=hy+150*k,stopR=HW*.16;
  T.steps.forEach((s,i)=>{
    if(t<s)return;
    const q=E.soft(seg(t,s,s+T.stepDur));
    gy=lerp(lerp(parkY,stopY,i/3),lerp(parkY,stopY,(i+1)/3),q);
    R=lerp(lerp(parkR,stopR,i/3),lerp(parkR,stopR,(i+1)/3),q);
    once('s'+i,()=>haptic('light'));
  });
  let open=t<T.open[0]?0:t<T.close[0]?E.inOut(seg(t,...T.open)):1-E.soft(seg(t,...T.close));
  if(t>T.dive[0]-.15)open=Math.max(open,E.inOut(seg(t,T.dive[0]-.15,T.dive[0]+.25))*1.25);
  const dyOpen=open*38;
  const cavY=hy+(186+dyOpen*.5)*k;
  let squash=0,clipK=0;
  if(t>=T.pull[0]){const pk=E.in4(seg(t,...T.pull));gy=lerp(stopY,cavY,pk);R=lerp(stopR,0,E.in(seg(t,...T.pull)));squash=pk*.35;clipK=E.out(seg(t,T.pull[0],T.pull[0]+.16));}
  const swallowed=t>=T.pull[1];
  if(t>=T.open[0])once('open',()=>haptic('medium'));
  if(t>=T.close[0])once('close',()=>haptic('heavy'));
  const ang=.18*t+(t>T.steps[0]?.6*E.out(seg(t,T.steps[0],T.pull[1])):0);
  const scan=.42*t;

  const tf=E.inOut(seg(t,T.morph[0],T.morph[0]+.5));
  stext.style.opacity=1-tf;stext.style.transform=`translateY(${tf*18}px)`;

  const dv=E.in(seg(t,...T.dive));
  const zoom=1+dv*14;
  const chamAlpha=1-E.inOut(seg(t,T.dive[0]+.25,T.dive[1]));
  const wv=seg(t,...T.wave),waveR=E.out(wv)*HW*1.1,waveA=wv>0?1-wv:0;

  const look=(ex,ey,o)=>{const dx=gx-ex,dy=gy-ey,d=Math.hypot(dx,dy)||1,r=Math.min(7*k,d*.04);
    const tx=dx/d*r,ty=dy/d*r;if(FREEZE!==null){o.x=tx;o.y=ty;}else{o.x=lerp(o.x,tx,.14);o.y=lerp(o.y,ty,.14);}};
  look(hx+54*k,hy+128*k,eyeL);look(hx+186*k,hy+128*k,eyeR);

  ctx.save();
  if(zoom>1){ctx.translate(W/2,cavY);ctx.scale(zoom,zoom);ctx.translate(-W/2,-cavY);}
  let cav=null;
  if(open>.005&&chamAlpha>0){
    cav=cavityPath(hx,hy,k,dyOpen);
    ctx.save();ctx.globalAlpha=chamAlpha;
    const cg=ctx.createRadialGradient(W/2,cavY,0,W/2,cavY,HW*.4);
    cg.addColorStop(0,`rgba(252,18,34,${.3*open})`);cg.addColorStop(.5,`rgba(90,4,12,${.45*open})`);cg.addColorStop(1,'rgba(8,0,2,.9)');
    ctx.fillStyle=cg;ctx.fill(cav);ctx.restore();
  }
  const drawP=seg(t,...T.draw);
  if(drawP>0&&chamAlpha>0){
    const breath=1+Math.sin(t*2.2)*.004;
    for(const c of cham){
      const appear=E.out5(clamp((drawP-c.d*.75)/.25));
      if(appear<=0)continue;
      let x=c.x,y=c.y;
      if(c.part==='jaw')y+=dyOpen;
      x=120+(x-120)*breath;y=110+(y-110)*breath;
      const fly=1-appear;
      const sx=hx+x*k+(c.j-.5)*24*fly,sy=hy+y*k+18*fly;
      let a,sz;
      switch(c.kind){
        case 'accent':a=1;sz=c.s*1.5;break;
        case 'line':a=.85;sz=c.s*1.15;break;
        case 'lip':a=.95;sz=c.s*1.2;break;
        case 'faint':a=.35;sz=c.s*.8;break;
        default:a=.34;sz=c.s*.8;
      }
      a*=.7+.3*clamp(1-y/240);
      if(waveA>0){const d=Math.hypot(sx-W/2,sy-cavY),w=Math.exp(-Math.pow((d-waveR)/18,2));a=Math.min(1,a+w*waveA*.9);sz*=1+w*waveA*.8;}
      a*=appear*chamAlpha;
      if(a<.01)continue;
      const kk=Math.max(.8,k*.9);
      if(c.kind==='accent'){ctx.beginPath();ctx.arc(sx,sy,sz*3.2*kk,0,7);ctx.fillStyle=`rgba(252,18,34,${a*.08})`;ctx.fill();}
      ctx.beginPath();ctx.arc(sx,sy,Math.max(.2,sz*kk),0,7);ctx.fillStyle=`rgba(252,18,34,${a})`;ctx.fill();
    }
    const glowNode=(x,y,s,a)=>{
      ctx.beginPath();ctx.arc(x,y,s*5,0,7);ctx.fillStyle=`rgba(252,18,34,${a*.07})`;ctx.fill();
      ctx.beginPath();ctx.arc(x,y,s*2.2,0,7);ctx.fillStyle=`rgba(252,18,34,${a*.22})`;ctx.fill();
      ctx.beginPath();ctx.arc(x,y,s,0,7);ctx.fillStyle=`rgba(255,40,52,${a})`;ctx.fill();};
    const nA=E.out(seg(drawP,.55,1))*chamAlpha;
    const eyeBoost=1+(t>T.close[0]?1.2*Math.exp(-seg(t,T.close[0],T.close[0]+1)*4):0);
    PUPILS.forEach(([x,y],i)=>{const o=i?eyeR:eyeL;glowNode(hx+x*k+o.x,hy+y*k+o.y,2.6*k*eyeBoost,nA);});
    NODESC.forEach(n=>glowNode(hx+n.x*k,hy+n.y*k,n.s*k,nA*.9));
  }
  if(!swallowed){
    if(clipK>0&&cav){
      if(clipK<1)drawGlobe(gx,gy,R,ang,scan,1-clipK,squash);
      ctx.save();ctx.clip(cav);drawGlobe(gx,gy,R,ang,scan,clipK,squash);ctx.restore();
    }else drawGlobe(gx,gy,R,ang,scan,1,0);
  }
  ctx.restore();

  if(dv>0){const g=ctx.createRadialGradient(W/2,cavY,0,W/2,cavY,Math.max(W,H)*(.2+dv));
    g.addColorStop(0,`rgba(252,18,34,${.55*dv})`);g.addColorStop(.5,`rgba(90,4,12,${.45*dv})`);g.addColorStop(1,`rgba(0,0,0,${.6*dv})`);
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);}

  const rv=E.out(seg(t,...T.reveal));
  reveal.style.opacity=rv;reveal.style.transform=`scale(${1.04-.04*rv})`;
  reveal.classList.toggle('on',rv>.6);
  if(FREEZE===null&&t<T.reveal[1]+.2)raf=requestAnimationFrame(frame);
}
function play(){
  cancelAnimationFrame(raf);t0=0;fired={};eyeL={x:0,y:0};eyeR={x:0,y:0};
  stext.querySelectorAll('*').forEach(el=>{el.style.animation='none';void el.offsetHeight;el.style.animation='';});
  raf=requestAnimationFrame(frame);
}
document.getElementById('again').onclick=play;
document.getElementById('open').onclick=()=>{location.href='index.html?demo';};
if(FREEZE!==null)document.querySelectorAll('#stext *').forEach(el=>{el.style.animation='none';el.style.opacity=1;el.style.transform='none';});
play();
</script>
</body>
